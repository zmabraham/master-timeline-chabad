[project]
name = "timeline-ingest"
version = "0.1.0"
description = "Offline ingestion pipeline for Master Timeline Chabad"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "anthropic>=0.40",
    "pyyaml>=6.0",
    "unidecode>=1.3",
    "httpx>=0.27",
    "pillow>=10.3",
    "markdown-it-py>=3.0",
    "aiofiles>=23.0",
    "rich>=13.7",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
