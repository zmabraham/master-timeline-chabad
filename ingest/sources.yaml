# Absolute paths to every source corpus on disk.
# All paths are read-only; this pipeline never writes to them.

existing_extractions:
  compact_json: /home/chassidusaicon/code/nanoclaw/groups/whatsapp_main/chabad-timeline-compact.json
  comprehensive_md: /home/chassidusaicon/code/nanoclaw/groups/whatsapp_main/chabad-history-timeline-comprehensive.md
  chabadpedia_kg_dir: /home/chassidusaicon/code/nanoclaw/groups/whatsapp_main/chabadpedia-web

books_to_extract:
  undaunted_dir: /home/chassidusaicon/code/nanoclaw/groups/whatsapp_main
  undaunted_chapters_glob: "undaunted_chapter*.txt"
  chabad_library_dir: /home/chassidusaicon/code/nanoclaw/groups/whatsapp_main/chabad-library-clean-books
  # Hebrew filename stems (the lookup is glob `*{stem}*` against chabad_library_dir).
  # All 17 books from the Misaviv L'Chassidus category exist here under Hebrew names.
  chabad_library_history_book_ids:
    - "מאסר_וגאולת_אדמו״ר_האמצעי"             # Imprisonment & Redemption of the Mitteler Rebbe
    - "תולדות_אברהם_חיים"                       # Toldos Avraham Chaim
    - "תולדות_חב״ד_בארץ_הקודש"                  # Chabad in the Holy Land
    - "תולדות_חב״ד_ברוסיה"                       # Chabad in Tsarist Russia
    - "תולדות_חב״ד_בפולין_ליטא_ולטביא"          # Chabad in Poland/Lithuania/Latvia
    - "זכרון_לבני_ישראל"                         # Zikhron Livnei Yisrael
    - "למען_ידעו_בנים"                           # L'maan Yedu Banim
    - "זכרונותי"                                 # Memoirs
    - "ליובאוויטש"                               # Lubavitch (community)
    - "מבית_הגנזים"                              # From the Archives
    - "תערוכות_הספריה"                           # Library Exhibitions
    - "יומן_השליחות_המיוחדת"                    # Special Mission Diary
    - "עבודת_הקודש"                              # Holy Work
    - "בכל_ביתי_נאמן_הוא"                       # In all My House
    - "אדמו״רי_חב״ד_ויהדות_בוכרה"               # Chabad Rebbes & Bukharan Jewry
    - "אדמו״רי_חב״ד_ויהדות_אוסטריה"             # Chabad Rebbes & Austrian Jewry
    - "אדמו״רי_חב״ד_ויהדות_גרמניה"               # Chabad Rebbes & German Jewry

# Chabadpedia bio pages deferred to v1.5: the 19,936 files are mediawiki API
# JSON responses, mostly stubs/redirects/errors; processing them via the LLM
# is wasteful without a content-quality pre-filter. Point at a non-existent
# path so run_pass2's `if pages_dir.exists()` guard skips this loop.
chabadpedia_pages:
  dir: /tmp/master-timeline-chabad-no-pages-v1

photos:
  knowledge_graph_files:
    - rebbes: /home/chassidusaicon/code/nanoclaw/groups/whatsapp_main/chabadpedia-web/chabadpedia_knowledge_graph_rebbes.json
    - people: /home/chassidusaicon/code/nanoclaw/groups/whatsapp_main/chabadpedia-web/chabadpedia_knowledge_graph_people.json
    - places: /home/chassidusaicon/code/nanoclaw/groups/whatsapp_main/chabadpedia-web/chabadpedia_knowledge_graph_places.json
    - publications: /home/chassidusaicon/code/nanoclaw/groups/whatsapp_main/chabadpedia-web/chabadpedia_knowledge_graph_publications.json

output:
  intermediate_dir: intermediate
  cache_dir: cache
  public_dir: ../public
  glossary_path: glossary.yaml
  significance_overrides_path: significance_overrides.yaml
